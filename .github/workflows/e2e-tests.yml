name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node.js dependencies
        working-directory: frontend
        run: npm ci

      - name: Run PR quick gate
        if: github.event_name == 'pull_request'
        run: ./test.sh quick
        env:
          CI: true

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "OPENAI_API_KEY=dummy-key-for-testing" >> .env
          echo "DEFAULT_LANGUAGE=zh" >> .env
          echo "JWT_SECRET=test-secret-for-ci" >> .env
          echo "IMAGE_API_KEY=sk-test-dummy-key-for-ci" >> .env
          echo "IMAGE_API_BASE_URL=https://api.openai.com/v1" >> .env
          echo "STORY_TTS_PROVIDER=minimax" >> .env
          echo "MINIMAX_API_KEY=test-key" >> .env
          echo "MINIMAX_E2E_LOCAL_AUDIO=1" >> .env
          echo "MINIMAX_E2E_LOCAL_IMAGE=1" >> .env

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run E2E tests
        run: ./test.sh e2e
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: frontend/test-results/
          retention-days: 7
