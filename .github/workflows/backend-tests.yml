name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Setup test database
        run: |
          mkdir -p data
          python -c "from src.database.models import init_db; init_db()"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run maintained backend gates
        run: |
          python -m mypy \
            src/ai/text_quality.py \
            src/services/music_service.py \
            src/services/music_playlist_service.py \
            src/database/models.py \
            --strict
          ./scripts/run-maintained-backend-tests.sh test
        env:
          PYTHONPATH: ${{ github.workspace }}
          TESTING: 'true'
          JWT_SECRET: 'test-secret-for-ci'
          OPENAI_API_KEY: 'sk-test-dummy-key-for-ci'
          IMAGE_API_KEY: 'sk-test-dummy-key-for-ci'
          IMAGE_API_BASE_URL: 'https://api.openai.com/v1'
          OPENAI_BASE_URL: 'https://api.openai.com/v1'
