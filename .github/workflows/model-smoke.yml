name: Model Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要验收的 branch、tag 或 commit；留空使用当前 ref。"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  model-smoke:
    name: Real provider release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: model-smoke
    env:
      CI: "1"
      MODEL_SMOKE_ENABLED: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      E2E_DETERMINISTIC_STORY: "0"
      MINIMAX_E2E_LOCAL_AUDIO: "0"
      MINIMAX_E2E_LOCAL_IMAGE: "0"
      E2E_NO_SANDBOX: "1"
      TEST_RUN_ROOT: ${{ github.workspace }}/.model-smoke-run
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run protected real provider smoke
        run: ./test.sh model-smoke

      - name: Upload model smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-smoke-evidence
          path: ${{ github.workspace }}/.model-smoke-run/
          if-no-files-found: warn
          retention-days: 14
