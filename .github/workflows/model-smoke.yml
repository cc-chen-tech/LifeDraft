name: Model Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要验收的 branch、tag 或 commit；留空使用当前 ref。"
        required: false
        type: string
      deploy_after_success:
        description: "Smoke 成功后发布该候选提交；仅供受保护的发布链路使用。"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  model-smoke:
    name: Real provider release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: model-smoke
    env:
      CI: "1"
      MODEL_SMOKE_ENABLED: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.deepseek.com/v1' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'deepseek-v4-flash' }}
      IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.MINIMAX_API_KEY }}
      IMAGE_API_BASE_URL: ${{ vars.IMAGE_API_BASE_URL || 'https://api.minimaxi.com/v1' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'image-01' }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MINIMAX_TTS_MODEL: ${{ vars.MINIMAX_TTS_MODEL || 'speech-2.8-hd' }}
      E2E_DETERMINISTIC_STORY: "0"
      MINIMAX_E2E_LOCAL_AUDIO: "0"
      MINIMAX_E2E_LOCAL_IMAGE: "0"
      E2E_NO_SANDBOX: "1"
      TEST_RUN_ROOT: ${{ github.workspace }}/.model-smoke-run
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify requested candidate matches run SHA
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_REF" ]; then
            git fetch --no-tags origin -- "$REQUESTED_REF"
            test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || {
              echo 'Requested ref differs from run head_sha; dispatch on the candidate ref.' >&2
              exit 1
            }
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install production audio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -c "from scripts.model_smoke import _check_audio_runtime; _check_audio_runtime()"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run protected real provider smoke
        run: ./test.sh model-smoke

      - name: Upload model smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-smoke-evidence
          include-hidden-files: true
          path: |
            ${{ github.workspace }}/.model-smoke-run/**/smoke-summary.json
            ${{ github.workspace }}/.model-smoke-run/**/model-events.jsonl
            ${{ github.workspace }}/.model-smoke-run/**/model-smoke-screenshot.png
            ${{ github.workspace }}/frontend/test-results/**/trace.zip
            ${{ github.workspace }}/frontend/test-results/**/test-failed-*.png
          if-no-files-found: error
          retention-days: 14

  request-deploy:
    name: Start candidate deployment after successful smoke
    needs: model-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_after_success
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch protected production deployment
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ inputs.ref }}
        with:
          script: |
            const candidateSha = process.env.CANDIDATE_SHA;
            if (!/^[0-9a-f]{40}$/.test(candidateSha)) {
              throw new Error('Automatic deployment requires an exact 40-character candidate SHA.');
            }
            if (candidateSha !== process.env.GITHUB_SHA) {
              throw new Error('Smoke run SHA differs from the requested deployment candidate.');
            }

            const { data } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main',
            });
            if (data.object.sha !== candidateSha) {
              core.notice('Candidate superseded on main; its successor will run smoke.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'deploy-production.yml', ref: 'main',
              inputs: { candidate_sha: process.env.CANDIDATE_SHA },
            });
