name: Wiki Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wiki-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run wiki integrity checks
        run: python scripts/check_wiki.py
