name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      force_after_local_preflight:
        description: "Local preflight passed and GitHub checks are unavailable; bypass the CI gate for this manual deployment."
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify all main checks passed
    runs-on: ubuntu-latest
    outputs:
      deploy_ref: ${{ steps.resolve.outputs.deploy_ref }}
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Resolve deployment ref
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const deployRef = 'main';
            let deploySha = context.payload.workflow_run?.head_sha;

            if (!deploySha) {
              const { data } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main',
              });
              deploySha = data.object.sha;
            }

            core.setOutput('deploy_ref', deployRef);
            core.setOutput('deploy_sha', deploySha);

      - name: Require successful main CI
        uses: actions/github-script@v7
        with:
          script: |
            if (
              '${{ github.event_name }}' === 'workflow_dispatch' &&
              '${{ inputs.force_after_local_preflight }}' === 'true'
            ) {
              core.warning('Manual production deployment is bypassing GitHub CI after local preflight.');
              return;
            }

            const requiredWorkflows = [
              'Backend Tests',
              'Python Code Quality',
              'Frontend Build',
              'Frontend Code Quality',
              'Frontend Tests',
              'Coverage Report',
              'CI',
              'Wiki Check',
              'E2E Tests',
            ];
            const sha = '${{ steps.resolve.outputs.deploy_sha }}';
            const deadline = Date.now() + 15 * 60 * 1000;

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
                head_sha: sha,
                per_page: 100,
              });

              const byName = new Map();
              for (const run of data.workflow_runs) {
                if (!byName.has(run.name)) byName.set(run.name, run);
              }

              const missing = requiredWorkflows.filter(name => !byName.has(name));
              const pending = requiredWorkflows.filter(name => {
                const run = byName.get(name);
                return run && run.status !== 'completed';
              });
              const failed = requiredWorkflows.filter(name => {
                const run = byName.get(name);
                return run && run.status === 'completed' && run.conclusion !== 'success';
              });

              if (!missing.length && !pending.length && !failed.length) {
                core.info(`All required workflows passed for ${sha}.`);
                return;
              }

              if (failed.length) {
                throw new Error(`Required workflow(s) failed for ${sha}: ${failed.join(', ')}`);
              }

              if (Date.now() > deadline) {
                throw new Error(
                  `Timed out waiting for required workflows for ${sha}. ` +
                  `Missing: ${missing.join(', ') || 'none'}; pending: ${pending.join(', ') || 'none'}`
                );
              }

              core.info(
                `Waiting for required workflows for ${sha}. ` +
                `Missing: ${missing.join(', ') || 'none'}; pending: ${pending.join(', ') || 'none'}`
              );
              await new Promise(resolve => setTimeout(resolve, 30000));
            }

  deploy:
    name: Deploy to ECS host
    runs-on: ubuntu-latest
    needs: verify-ci
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://story101.live' }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/ecs_deploy_key
          chmod 600 ~/.ssh/ecs_deploy_key
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via Docker Compose
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER || 'root' }}
          ECS_DEPLOY_PATH: ${{ vars.ECS_DEPLOY_PATH || '/opt/story2' }}
          DEPLOY_REF: ${{ needs.verify-ci.outputs.deploy_ref }}
          DEPLOY_SHA: ${{ needs.verify-ci.outputs.deploy_sha }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GITHUB_DEPLOY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${MINIMAX_API_KEY}" ]; then
            echo "MINIMAX_API_KEY secret is required for production audio deployment." >&2
            exit 1
          fi

          MINIMAX_API_KEY_B64="$(printf '%s' "${MINIMAX_API_KEY}" | base64 | tr -d '\n')"
          GITHUB_DEPLOY_TOKEN_B64="$(printf '%s' "${GITHUB_DEPLOY_TOKEN}" | base64 | tr -d '\n')"
          ssh -i ~/.ssh/ecs_deploy_key "${ECS_USER}@${ECS_HOST}" \
            "DEPLOY_REF='${DEPLOY_REF}' DEPLOY_SHA='${DEPLOY_SHA}' ECS_DEPLOY_PATH='${ECS_DEPLOY_PATH}' MINIMAX_API_KEY_B64='${MINIMAX_API_KEY_B64}' GITHUB_DEPLOY_TOKEN_B64='${GITHUB_DEPLOY_TOKEN_B64}' bash -s" <<'EOF'
          set -euo pipefail
          cd "${ECS_DEPLOY_PATH}"
          GITHUB_DEPLOY_TOKEN="$(printf '%s' "${GITHUB_DEPLOY_TOKEN_B64}" | base64 -d)"
          unset GITHUB_DEPLOY_TOKEN_B64
          cleanup_git_remote() {
            git remote set-url origin https://github.com/cc-chen-tech/LifeDraft.git || true
          }
          trap cleanup_git_remote EXIT
          git remote set-url origin "https://x-access-token:${GITHUB_DEPLOY_TOKEN}@github.com/cc-chen-tech/LifeDraft.git"
          git fetch origin main
          git remote set-url origin https://github.com/cc-chen-tech/LifeDraft.git
          unset GITHUB_DEPLOY_TOKEN
          git checkout main
          git reset --hard "${DEPLOY_SHA}"
          MINIMAX_API_KEY="$(printf '%s' "${MINIMAX_API_KEY_B64}" | base64 -d)"
          export MINIMAX_API_KEY
          export STORY_TTS_PROVIDER=minimax
          MINIMAX_TTS_MODEL="$(sed -n 's/^MINIMAX_TTS_MODEL=//p' .env.example | head -n 1)"
          if [ -z "${MINIMAX_TTS_MODEL}" ]; then
            echo "Deployed revision must declare MINIMAX_TTS_MODEL in .env.example." >&2
            exit 1
          fi
          export MINIMAX_TTS_MODEL
          export STORY_TTS_AUTO_READ_DEFAULT_ENABLED=true
          export ENABLE_DAILY_TIMELINE_V2=true
          export ENABLE_DAILY_WORLD_PROJECTION_V1=true
          export MINIMAX_TIMEOUT_SECONDS=180
          export IMAGE_API_KEY="${MINIMAX_API_KEY}"
          export IMAGE_API_BASE_URL=https://api.minimaxi.com/v1
          export IMAGE_MODEL=image-01
          export TEXT_TO_IMAGE_MODELS=image-01
          export IMAGE_EDIT_MODELS=image-01,image-01-live
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(".env")
          updates = {
              "MINIMAX_API_KEY": os.environ["MINIMAX_API_KEY"],
              "STORY_TTS_PROVIDER": os.environ["STORY_TTS_PROVIDER"],
              "MINIMAX_TTS_MODEL": os.environ["MINIMAX_TTS_MODEL"],
              "STORY_TTS_AUTO_READ_DEFAULT_ENABLED": os.environ["STORY_TTS_AUTO_READ_DEFAULT_ENABLED"],
              "ENABLE_DAILY_TIMELINE_V2": os.environ["ENABLE_DAILY_TIMELINE_V2"],
              "ENABLE_DAILY_WORLD_PROJECTION_V1": os.environ["ENABLE_DAILY_WORLD_PROJECTION_V1"],
              "MINIMAX_TIMEOUT_SECONDS": os.environ["MINIMAX_TIMEOUT_SECONDS"],
              "IMAGE_API_KEY": os.environ["IMAGE_API_KEY"],
              "IMAGE_API_BASE_URL": os.environ["IMAGE_API_BASE_URL"],
              "IMAGE_MODEL": os.environ["IMAGE_MODEL"],
              "TEXT_TO_IMAGE_MODELS": os.environ["TEXT_TO_IMAGE_MODELS"],
              "IMAGE_EDIT_MODELS": os.environ["IMAGE_EDIT_MODELS"],
          }

          existing_lines = env_path.read_text(encoding="utf-8").splitlines() if env_path.exists() else []
          seen = set()
          output = []
          for line in existing_lines:
              stripped = line.strip()
              if not stripped or stripped.startswith("#") or "=" not in line:
                  output.append(line)
                  continue
              key = line.split("=", 1)[0].strip()
              if key in updates:
                  output.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  output.append(line)

          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")

          env_path.write_text("\n".join(output) + "\n", encoding="utf-8")
          env_path.chmod(0o600)
          PY
          docker compose -f docker-compose.ecs.yml up -d --build
          docker rm -f story2-music 2>/dev/null || true
          docker compose -f docker-compose.ecs.yml ps

          for attempt in $(seq 1 36); do
            backend_status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' story2-backend 2>/dev/null || true)"
            if [ "${backend_status}" = "healthy" ]; then
              echo "Backend container is healthy."
              exit 0
            fi

            echo "Waiting for backend health (${attempt}/36): ${backend_status:-unknown}"
            sleep 5
          done

          docker compose -f docker-compose.ecs.yml logs --tail=120 backend
          echo "Backend container did not become healthy in time." >&2
          exit 1
          EOF

      - name: Smoke test
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://story101.live' }}
        run: |
          set -euo pipefail
          base="${PRODUCTION_URL%/}"
          for endpoint in /health /api/health; do
            for attempt in $(seq 1 24); do
              if curl -fsS "${base}${endpoint}"; then
                echo "Smoke test passed for ${endpoint}."
                break
              fi

              if [ "${attempt}" = "24" ]; then
                echo "Smoke test failed for ${endpoint} after ${attempt} attempts." >&2
                exit 1
              fi

              echo "Waiting for ${endpoint} (${attempt}/24)..."
              sleep 5
            done
          done
          health_json="$(curl -fsS "${base}/api/health")"
          HEALTH_JSON="${health_json}" python3 - <<'PY'
          import json
          import os

          capabilities = json.loads(os.environ["HEALTH_JSON"])["capabilities"]
          assert capabilities["daily_timeline_v2"] is True
          assert capabilities["daily_world_projection_v1"] is True
          assert capabilities["tts_provider"] == "minimax"
          assert capabilities["tts_provider_available"] is True
          assert capabilities["music_runtime_enabled"] is False
          PY
