name: Coverage Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Setup test database
        run: |
          mkdir -p data
          python -c "from src.database.models import init_db; init_db()"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run maintained backend coverage
        run: |
          pytest \
            tests/test_gate_preflight_no_mock.py \
            tests/test_gate_gameplay_behavior_no_mock.py \
            tests/test_gate_static_no_mock.py \
            tests/test_imports.py \
            tests/test_gate_imports_no_mock.py \
            tests/test_api_contract.py \
            tests/test_gate_contracts_no_mock.py \
            tests/test_shift_left_e2e_contract_no_mock.py \
            tests/test_story_music_recommendation_contract.py \
            tests/test_integration_real_db.py \
            tests/test_database.py \
            tests/test_gate_real_db_no_mock.py \
            tests/test_story_music_recommendation_db.py \
            tests/test_music_degradation_no_mock.py \
            tests/test_world_model_updater_contracts.py \
            tests/test_collection_shape_contracts.py \
            tests/test_round_illustration_contracts.py \
            tests/test_sse_helper_state_contracts.py \
            tests/test_image_prompt_builder_contracts.py \
            tests/test_event_fallback_context_contracts.py \
            tests/test_gameplay_event_protocol_contracts.py \
            tests/test_extraction_parser_contracts.py \
            tests/test_local_music_library_helper_contracts.py \
            tests/test_multi_character_scene_contract.py \
            tests/test_historical_summary_selection_contracts.py \
            tests/test_narrative_state_contracts.py \
            tests/test_character_creation_pure_contracts.py \
            tests/test_decision_state_contracts.py \
            tests/test_npc_attribute_contracts.py \
            tests/test_temporal_validator_contract.py \
            tests/test_harness_consistency_contracts.py \
            tests/test_harness_state_contracts.py \
            tests/test_harness_validators_contract.py \
            tests/test_harness_content_contracts.py \
            tests/test_validation_pipeline_contract.py \
            tests/test_preflight_context.py \
            tests/test_preflight_prompt_contracts.py \
            tests/test_retry_controller_contract.py \
            tests/test_diagnostics_contracts.py \
            tests/test_quality_level_contract.py \
            tests/test_quality_level_master_retries_contract.py \
            tests/test_consistency_parser_contracts.py \
            tests/test_era_sanitization.py \
            tests/test_security_prompt_injection_contract.py \
            tests/test_world_model_updater_state_contracts.py \
            tests/test_choice_processor_state_contracts.py \
            tests/test_sse_completed_replay_contracts.py \
            tests/test_entity_collection_reliability_no_mock.py \
            tests/test_character_service_contract.py \
            tests/test_story_continuation_drift_contract.py \
            tests/test_monthly_summary_contract.py \
            tests/test_yearly_summary_contract.py \
            tests/test_event_generation_contract.py \
            tests/test_scene_image_sse_contract.py \
            tests/test_image_generator_pure_contracts.py \
            tests/test_fallback_events_contract.py \
            tests/test_scheduled_events_contract.py \
            tests/test_scheduled_events.py \
            tests/test_music_scene_matching_quality_contract.py \
            tests/test_music_era_recommendation_contract.py \
            tests/test_game_loop_current_event_restore.py \
            tests/test_life_summary_grounding_no_mock.py \
            tests/test_life_summary_grounding_db_no_mock.py \
            tests/test_life_summary_grounding_imports_no_mock.py \
            tests/test_sse_terminal_state_contracts.py \
            tests/test_sse_thread_pool_contract.py \
            tests/test_scene_image_constraint_contract.py \
            tests/test_image_thread_pool_contract.py \
            tests/test_local_minimax_provider_contracts.py \
            tests/test_live_gameplay_recovery_collection_contract.py \
            tests/test_collection_recognition_current_event.py \
            tests/test_gameplay_event_protocol_contracts.py \
            tests/test_image_compression_db.py \
            tests/test_choice_processor_contract.py \
            tests/test_system_mixin_contract.py \
            tests/test_relationship_events_contract.py \
            tests/test_session_service_scene_storage_contracts.py \
            tests/test_game_loop_load_recovery_contracts.py \
            tests/test_image_compressor_db.py \
            tests/test_language_contract.py \
            tests/test_narrative_fate_echo.py \
            --cov=src --cov-report=xml --cov-report=term --cov-fail-under=50
        env:
          PYTHONPATH: ${{ github.workspace }}
          TESTING: 'true'
          JWT_SECRET: 'test-secret-for-ci'
          OPENAI_API_KEY: 'sk-test-dummy-key-for-ci'
          IMAGE_API_KEY: 'sk-test-dummy-key-for-ci'
          IMAGE_API_BASE_URL: 'https://api.openai.com/v1'
          OPENAI_BASE_URL: 'https://api.openai.com/v1'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest with coverage
        run: npm run test:coverage -- --coverageReporters=text --coverageReporters=cobertura

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/cobertura-coverage.xml
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
