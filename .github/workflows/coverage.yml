name: Coverage Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Setup test database
        run: |
          mkdir -p data
          python -c "from src.database.models import init_db; init_db()"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run maintained backend coverage
        run: |
          pytest \
            tests/test_gate_preflight_no_mock.py \
            tests/test_gate_gameplay_behavior_no_mock.py \
            tests/test_gate_static_no_mock.py \
            tests/test_imports.py \
            tests/test_gate_imports_no_mock.py \
            tests/test_api_contract.py \
            tests/test_gate_contracts_no_mock.py \
            tests/test_story_music_recommendation_contract.py \
            tests/test_integration_real_db.py \
            tests/test_database.py \
            tests/test_gate_real_db_no_mock.py \
            tests/test_story_music_recommendation_db.py \
            tests/test_music_degradation_no_mock.py \
            --cov=src --cov-report=xml --cov-report=term
        env:
          PYTHONPATH: ${{ github.workspace }}
          TESTING: 'true'
          JWT_SECRET: 'test-secret-for-ci'
          OPENAI_API_KEY: 'sk-test-dummy-key-for-ci'
          IMAGE_API_KEY: 'sk-test-dummy-key-for-ci'
          IMAGE_API_BASE_URL: 'https://api.openai.com/v1'
          OPENAI_BASE_URL: 'https://api.openai.com/v1'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest with coverage
        run: npm run test:coverage -- --coverageReporters=text --coverageReporters=cobertura

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/cobertura-coverage.xml
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
