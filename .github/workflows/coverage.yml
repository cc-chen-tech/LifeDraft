name: Coverage Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Run maintained backend coverage
        run: |
          ./scripts/run-maintained-backend-tests.sh coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          TESTING: 'true'
          JWT_SECRET: 'test-secret-for-ci'
          OPENAI_API_KEY: 'sk-test-dummy-key-for-ci'
          IMAGE_API_KEY: 'sk-test-dummy-key-for-ci'
          IMAGE_API_BASE_URL: 'https://api.openai.com/v1'
          OPENAI_BASE_URL: 'https://api.openai.com/v1'

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest with coverage
        run: npm run test:coverage -- --coverageReporters=text --coverageReporters=cobertura --coverageReporters=html

      - name: Verify frontend coverage reports
        run: |
          test -f coverage/cobertura-coverage.xml
          test -f coverage/index.html

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 30
