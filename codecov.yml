# Codecov configuration
# Documentation: https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        base: auto
        branches:
          - main
        if_ci_failed: error
        informational: false
        only_pulls: false
      python:
        target: 80%
        threshold: 2%
        flags:
          - python
      frontend:
        target: 80%
        threshold: 2%
        flags:
          - frontend
    patch:
      default:
        target: 70%
        threshold: 2%
        base: auto
        branches:
          - main
        if_ci_failed: error
        informational: false
        only_pulls: false

flags:
  python:
    paths:
      - src/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  # Python test files and fixtures
  - "tests/**/*"
  - "**/test_*.py"
  - "**/*_test.py"
  # Frontend test files
  - "frontend/e2e/**/*"
  - "frontend/**/__tests__/**/*"
  - "frontend/**/*.spec.ts"
  - "frontend/**/*.spec.tsx"
  - "frontend/**/*.test.ts"
  - "frontend/**/*.test.tsx"
  # Configuration files
  - "config/**/*"
  - "scripts/**/*"
  - "docs/**/*"
  # Auto-generated files
  - "**/*.d.ts"
  - "frontend/.next/**/*"
  - "frontend/coverage/**/*"
