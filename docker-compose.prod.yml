version: '3.8'

# 生产环境配置（在docker-compose.yml基础上扩展）
services:
  app:
    # 继承基础配置
    extends:
      file: docker-compose.yml
      service: app
    # 生产环境特定配置
    environment:
      # 强制使用生产环境变量
      - ENVIRONMENT=production
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
      # 叙事引擎三大系统
      - ENABLE_CONSTRAINT_HARNESS=${ENABLE_CONSTRAINT_HARNESS:-true}
      - ENABLE_NARRATIVE_STYLE_ENGINE=${ENABLE_NARRATIVE_STYLE_ENGINE:-true}
      - ENABLE_CREATIVE_ENHANCEMENT=${ENABLE_CREATIVE_ENHANCEMENT:-true}
      - ENABLE_EPIC_NARRATIVE=${ENABLE_EPIC_NARRATIVE:-true}
    # 生产环境不暴露端口，通过nginx反向代理
    ports: []
    # 添加日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx反向代理（生产环境推荐）
  nginx:
    image: nginx:alpine
    container_name: story2-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL证书目录（需要自己配置）
    depends_on:
      - app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
