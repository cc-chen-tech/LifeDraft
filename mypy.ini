[mypy]
python_version = 3.11
strict = True
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = silent
exclude = venv|\.git|__pycache__|\.pytest_cache

[mypy-src.api.routers.collection]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.ai.narrative.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-src.ai.harness.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-src.ai.model_fallback]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.ai.truncation_recovery]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-config.feature_flags]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.game.parallel_postprocessor]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True
