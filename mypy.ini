[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = venv|\.git|__pycache__|\.pytest_cache

[mypy-src.api.routers.collection]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-src.ai.narrative.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-src.ai.creative.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-src.ai.harness.*]
disallow_untyped_defs = True
warn_return_any = True

[mypy-src.ai.model_fallback]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.ai.truncation_recovery]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.ai.generation_state]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-config.feature_flags]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.game.parallel_postprocessor]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True

[mypy-src.ai.reactive_compressor]
disallow_untyped_defs = True
disallow_any_generics = True
warn_return_any = True
