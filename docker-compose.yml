version: '3.8'

services:
  # Streamlit应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story2-app
    ports:
      - "8501:8501"
    environment:
      # OpenAI配置（从.env文件读取）
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # 数据库配置
      - DATABASE_URL=${DATABASE_URL:-}
      # 应用配置
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-zh}
      - CACHE_EVENTS=${CACHE_EVENTS:-true}
    volumes:
      # 持久化数据目录
      - ./data:/app/data
      # 可选：挂载.env文件（如果不想用环境变量）
      # - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # 资源限制（可选，根据服务器配置调整）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

