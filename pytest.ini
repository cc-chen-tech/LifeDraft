[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (database, file system)
    e2e: End-to-end tests (full stack)
    api: API endpoint tests
    slow: Slow tests (>5s)
