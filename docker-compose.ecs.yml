version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: story2-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ecs-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./logs/nginx:/var/log/nginx
      - ./data/certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
      - music-api
    restart: unless-stopped
    networks:
      - story2-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story2-backend
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - story2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  music-api:
    build:
      context: ./netease-music-api
      dockerfile: Dockerfile
    container_name: story2-music
    environment:
      - PORT=3001
    restart: unless-stopped
    networks:
      - story2-network

  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: story2-frontend-builder
    volumes:
      - ./frontend/dist:/output
    command: sh -c "cp -r /app/dist/* /output/ && echo 'Frontend build copied'"

networks:
  story2-network:
    driver: bridge
